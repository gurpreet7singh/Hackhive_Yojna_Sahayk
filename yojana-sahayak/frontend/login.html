
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Yojana Sahayak</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f4f8f0, #fff9e9);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(30, 70, 35, 0.10);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: #e9f5e8;
            color: #247a36;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            border-radius: 18px;
            font-size: 28px;
        }

        .brand h2 {
            font-weight: 800;
            color: #245c30;
            margin-bottom: 6px;
        }

        .brand p {
            color: #777;
            font-size: 14px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .form-control {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #dfe5dc;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #398344;
            box-shadow: 0 0 0 3px rgba(57, 131, 68, 0.12);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #287b38;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-login:hover {
            background: #1f622c;
            color: white;
        }

        .btn-login:disabled {
            opacity: 0.7;
        }

        .bottom-text {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .bottom-text a {
            color: #287b38;
            font-weight: 700;
            text-decoration: none;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
            font-size: 13px;
        }

        .home-link:hover {
            color: #287b38;
        }

        #message {
            display: none;
            font-size: 13px;
            border-radius: 8px;
        }

        @media(max-width: 480px) {
            .auth-container { padding: 28px 22px; }
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="brand">
        <div class="brand-icon">🌱</div>
        <h2>Welcome Back!</h2>
        <p>Login to your Yojana Sahayak account</p>
    </div>

    <div id="message" class="alert"></div>

    <form id="loginForm">

        <div class="mb-3">
            <label class="form-label" for="email">Email Address</label>
            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
            Login
        </button>

    </form>

    <div class="bottom-text">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

    <a href="index.html" class="home-link">← Back to Home</a>

</div>

<script>
const AUTH_API = "http://localhost/yojana-sahayak/backend/api/auth.php";
const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginBtn");

function showMessage(text, type = "danger") {
    message.className = `alert alert-${type}`;
    message.textContent = text;
    message.style.display = "block";
}

form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Logging in...";
    message.style.display = "none";

    try {
        const response = await fetch(`${AUTH_API}?action=login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
                email,
                password
            })
        });

        const result = await response.json();

        if (result.success) {

            showMessage("Login successful! Redirecting...", "success");

            // Inform chat.js that the user is authenticated
            localStorage.setItem("yojana_logged_in", "true");

            setTimeout(() => {
                window.location.href = "index.html";
            }, 800);

        } else {
            showMessage(result.message || "Invalid email or password.");
        }

    } catch (error) {
        console.error("Login error:", error);
        showMessage("Unable to connect to the server. Please try again.");
    }

    button.disabled = false;
    button.textContent = "Login";
});
</script>

</body>
</html>
